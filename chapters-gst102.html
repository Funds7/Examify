<!DOCTYPE html>
<html>
<head>
  <title>GST 102 Chapters</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2 style="text-align:center;">
📚 GST 102 - Philosophy and Human Existence
</h2>

<div id="chapterList"></div>

<script src="gst102.js"></script>

<script>

let html = "";

// render chapter list
gst102Chapters.forEach(chapter => {

  html += `
    <div class="course-card">

      <h3>Chapter ${chapter.id}</h3>

      <p>${chapter.title}</p>

      <button onclick="openChapter(${chapter.id})">
        📚 Learn
      </button>

    </div>
  `;
});

// CBT test card
html += `
  <div class="course-card">
    <h3>🏆 GST 102 Course Test</h3>
    <a href="exam.html?course=gst102">
      Start CBT Exam
    </a>
  </div>
`;

document.getElementById("chapterList").innerHTML = html;

// ✅ FIXED FUNCTION (IMPORTANT)
function openChapter(id){

  // IMPORTANT: match learn page keys exactly
  localStorage.setItem("course", "gst102");
  localStorage.setItem("chapter", id);

  // go to learn page (NO ID PARAMS)
  window.location.href = "learn.html";
}

</script>

</body>
</html>
