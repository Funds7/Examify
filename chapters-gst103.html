<!DOCTYPE html>
<html>
<head>
  <title>GST 103 Chapters</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2 style="text-align:center;">
📚 GST 103 - DELSU Culture and Ethics
</h2>

<div id="chapterList"></div>

<script src="gst103.js"></script>

<script>
let html = "";

gst103Chapters.forEach(chapter => {

  html += `
    <div class="course-card">

      <h3>Chapter ${chapter.id}</h3>

      <p>${chapter.title}</p>

      <button onclick="openChapter(${chapter.id})">
        📚 Learn
      </button>

    </div>
  `;
});

html += `
  <div class="course-card">
    <h3>🏆 GST 103 Course Test</h3>
    <a href="exam.html?course=gst103">
      Start CBT Exam
    </a>
  </div>
`;

document.getElementById("chapterList").innerHTML = html;

function openChapter(id){
  
  window.location.href = "chapter.html";
}
</script>

</body>
</html>
