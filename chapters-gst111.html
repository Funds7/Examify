<!DOCTYPE html>
<html>
<head>
  <title>GST 111 Chapters</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2 style="text-align:center;">
📚 GST 111 - Nigerian Peoples, Culture and Entrepreneurial Skills
</h2>

<div id="chapterList"></div>

<script src="gst111.js"></script>

<script>
let html = "";

gst111Chapters.forEach(chapter => {

  html += `
    <div class="course-card">

      <h3>Chapter ${chapter.id}</h3>

      <p>${chapter.title}</p>

      <button onclick="openChapter(${chapter.id})">
        📚 Learn
      </button>

    </div>
  `;
});

html += `
  <div class="course-card">
    <h3>🏆 GST 111 Course Test</h3>
    <a href="exam.html?course=gst111">
      Start CBT Exam
    </a>
  </div>
`;

document.getElementById("chapterList").innerHTML = html;

function openChapter(id) {

  localStorage.setItem("course", "gst111"); // change to gst101, gst102, etc.
  localStorage.setItem("chapter", id);

  window.location.href = "learn.html";
}

  window.location.href = "learn.html";
}
</script>

</body>
</html>
