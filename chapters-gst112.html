<!DOCTYPE html>
<html>
<head>
  <title>GST 112 Chapters</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2 style="text-align:center;">
📚 GST 112 - History and Philosophy of Science and Technology
</h2>

<div id="chapterList"></div>

<script src="gst112.js"></script>

<script>
let html = "";

gst112Chapters.forEach(chapter => {

  html += `
    <div class="course-card">

      <h3>Chapter ${chapter.id}</h3>

      <p>${chapter.title}</p>

      <button onclick="openChapter(${chapter.id})">
        📚 Learn
      </button>

    </div>
  `;
});

html += `
  <div class="course-card">
    <h3>🏆 GST 112 Course Test</h3>
    <a href="exam.html?course=gst112">
      Start CBT Exam
    </a>
  </div>
`;

function openChapter(id) {

  localStorage.setItem("course", "gst112");
  localStorage.setItem("chapter", id);

  window.location.href = "learn.html";
}
