<!DOCTYPE html>
<html>
<head>
    <title>GST 113 Chapters</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="chapter-header">
        <h1>GST 113</h1>
        <span>Peace Studies and Conflict Resolution</span>
        <p>📚 Choose a chapter to begin learning.</p>
    </div>

    <div id="chapterList"></div>

</div>

<script src="gst113.js"></script>

<script>

let html = "";

gst113Chapters.forEach(chapter => {

html += `

<div class="course-card">

    <div class="point-title">
        Chapter ${chapter.id}
    </div>

    <div class="point-body">
        ${chapter.title}
    </div>

    <div class="card-buttons">

        <button class="small-btn"
        onclick="openChapter(${chapter.id})">
        📖 Learn
        </button>

    </div>

</div>

`;

});

html += `

<div class="course-card">

    <div class="point-title">
        🏆 GST 113 Course Test
    </div>

    <div class="point-body">
        Test everything you've learned in GST 113.
    </div>

    <div class="card-buttons">

        <button class="small-btn"
        onclick="location.href='exam.html?course=gst113'">
        📝 Start CBT Exam
        </button>

    </div>

</div>

`;

document.getElementById("chapterList").innerHTML = html;

function openChapter(id){

    localStorage.setItem("course","gst113");
    localStorage.setItem("chapter",id);

    window.location.href="learn.html";

}

</script>

</body>
</html>
