<!DOCTYPE html>
<html>
<head>
  <title>GST 113 Chapters</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2 style="text-align:center;">
📚 GST 113 - Peace Studies and Conflict Resolution
</h2>

<div id="chapterList"></div>

<script src="gst113.js"></script>

<script>
let html = "";

gst113Chapters.forEach(chapter => {

  html += `
    <div class="course-card">

      <h3>Chapter ${chapter.id}</h3>

      <p>${chapter.title}</p>

      <button onclick="openChapter(${chapter.id})">
        📚 Learn
      </button>

    </div>
  `;
});

html += `
  <div class="course-card">
    <h3>🏆 GST 113 Course Test</h3>
    <a href="exam.html?course=gst113">
      Start CBT Exam
    </a>
  </div>
`;

document.getElementById("chapterList").innerHTML = html;

function openChapter(id){
  localStorage.setItem("gstCourse","gst113");
  localStorage.setItem("chapterId",id);

  window.location.href = "chapter.html?id=" + id;
}
</script>

</body>
</html>
