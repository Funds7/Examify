<!DOCTYPE html>
<html>
<head>
  <title>GST 114 Chapters</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2 style="text-align:center;">
📚 GST 114 - Communication in French
</h2>

<div id="chapterList"></div>

<script src="gst114.js"></script>

<script>
let html = "";

gst114Chapters.forEach(chapter => {

  html += `
    <div class="course-card">

      <h3>Chapter ${chapter.id}</h3>

      <p>${chapter.title}</p>

      <button onclick="openChapter(${chapter.id})">
        📚 Learn
      </button>

    </div>
  `;
});

html += `
  <div class="course-card">
    <h3>🏆 GST 114 Course Test</h3>
    <a href="exam.html?course=gst114">
      Start CBT Exam
    </a>
  </div>
`;

document.getElementById("chapterList").innerHTML = html;

function openChapter(id){
  localStorage.setItem("gstCourse","gst114");
  localStorage.setItem("chapterId",id);

  window.location.href = "chapter.html?id=" + id;
}
</script>

</body>
</html>
