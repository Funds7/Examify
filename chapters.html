<!DOCTYPE html>
<html>
<head>
  <title>Examify Chapter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 15px;
    }

    .box {
      background: #f4f6f9;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 10px 15px;
      margin-top: 10px;
      background: #0d6efd;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .muted {
      color: gray;
    }

    .error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h2 id="courseTitle">Loading...</h2>
  <h3 id="chapterTitle">Loading chapter...</h3>

  <div class="box" id="learnBox">
    Loading content...
  </div>

  <a class="btn" id="backBtn">⬅ Back</a>
  <a class="btn" id="testBtn">📝 Take Course Test</a>

</div>

<!-- LOAD CONTENT -->
<script src="content.js"></script>

<script>

const params = new URLSearchParams(window.location.search);

const course = params.get("course");
const chapterId = parseInt(params.get("chapter"));

// 🔴 SAFETY CHECK
if (!course || isNaN(chapterId)) {
  document.getElementById("learnBox").innerHTML =
    `<p class="error">❌ Invalid chapter link. Go back and select a chapter.</p>`;
  throw new Error("Missing URL parameters");
}

// Course names
const courses = {
  gst101: "GST 101 - Use of English & Library",
  gst102: "GST 102 - Philosophy & Human Existence",
  gst103: "GST 103 - Culture & Ethics",
  gst111: "GST 111 - Nigerian Peoples & Culture",
  gst112: "GST 112 - History & Philosophy of Science",
  gst113: "GST 113 - Peace Studies & Conflict Resolution",
  gst114: "GST 114 - Communication in French"
};

// Set titles
document.getElementById("courseTitle").innerText =
  courses[course] || "Unknown Course";

document.getElementById("chapterTitle").innerText =
  "Chapter " + chapterId;

// Load content
function getLearnContent() {

  if (!CONTENT || !CONTENT[course]) {
    return `<p class="error">❌ Course not found in content.js</p>`;
  }

  const chapter = CONTENT[course]["chapter" + chapterId];

  if (!chapter || chapter.length === 0) {
    return `<p class="error">📌 No content available for this chapter.</p>`;
  }

  return chapter.map(p => `<p>${p}</p>`).join("<br>");
}

// Display
document.getElementById("learnBox").innerHTML = `
  <div class="title">Chapter ${chapterId}</div>
  <p class="muted">Learn Section</p>
  ${getLearnContent()}
`;

// Navigation
document.getElementById("backBtn").href =
  "chapters-" + course + ".html";

document.getElementById("testBtn").href =
  "exam.html?course=" + course;

</script>

</body>
</html>
