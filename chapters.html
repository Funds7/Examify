<!DOCTYPE html>
<html>
<head>
  <title>Examify Chapter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial; background:#f4f6f9; }

    .container { max-width:800px; margin:auto; padding:15px; }

    .box {
      background:white;
      padding:15px;
      border-radius:10px;
      margin-top:10px;
    }

    .btn {
      padding:10px;
      background:#0d6efd;
      color:white;
      text-decoration:none;
      border-radius:6px;
      display:inline-block;
      margin-top:10px;
    }

    .point {
      padding:10px;
      border-bottom:1px solid #eee;
      cursor:pointer;
    }

    .point:hover { background:#f0f0f0; }

    input {
      width:100%;
      padding:10px;
      margin-top:10px;
      border-radius:6px;
      border:1px solid #ccc;
    }

    .topbar {
      display:flex;
      gap:10px;
      margin-top:10px;
    }

    .smallbtn {
      flex:1;
      padding:8px;
      text-align:center;
      background:#333;
      color:white;
      border-radius:6px;
      cursor:pointer;
    }

    .active { background:green !important; }
  </style>
</head>

<body>

<div class="container">

  <h2 id="courseTitle">Loading...</h2>
  <h3 id="chapterTitle">Loading...</h3>

  <input id="search" placeholder="Search this chapter...">

  <div class="topbar">
    <div class="smallbtn" onclick="toggleImportant()">Important Mode</div>
    <div class="smallbtn" onclick="showBookmarks()">Bookmarks</div>
  </div>

  <div class="box" id="contentBox">Loading...</div>

  <a class="btn" id="backBtn">⬅ Back</a>
  <a class="btn" id="testBtn">📝 Take Test</a>

</div>

<script src="content.js"></script>

<script>

const course = localStorage.getItem("gstCourse");
const chapterId = parseInt(localStorage.getItem("chapterId"));

const courses = {
  gst101: "GST 101 - Use of English & Library",
  gst102: "GST 102 - Philosophy & Human Existence",
  gst103: "GST 103 - Culture & Ethics"
};

let importantMode = false;
let bookmarks = JSON.parse(localStorage.getItem("bookmarks") || "[]");

document.getElementById("courseTitle").innerText = courses[course];
document.getElementById("chapterTitle").innerText =
  CONTENT[course].meta.chapters[chapterId];

// render
function render(list) {
  const box = document.getElementById("contentBox");

  box.innerHTML = list.map((p, i) => `
    <div class="point">
      ${p}
      <div style="font-size:12px;margin-top:5px;">
        ⭐ <span onclick="bookmark('${p}')">Bookmark</span>
      </div>
    </div>
  `).join("");
}

// load
function load() {
  let data = CONTENT[course].chapters[chapterId];

  if (importantMode) {
    data = data.filter(p => p.length < 120);
  }

  render(data);
}

// search
document.getElementById("search").addEventListener("input", e => {
  const value = e.target.value.toLowerCase();

  let data = CONTENT[course].chapters[chapterId];

  data = data.filter(p => p.toLowerCase().includes(value));

  render(data);
});

// bookmarks
function bookmark(text) {
  if (!bookmarks.includes(text)) {
    bookmarks.push(text);
    localStorage.setItem("bookmarks", JSON.stringify(bookmarks));
    alert("Bookmarked!");
  }
}

function showBookmarks() {
  render(bookmarks);
}

// important mode
function toggleImportant() {
  importantMode = !importantMode;
  load();
}

load();

document.getElementById("backBtn").href =
  "chapters-" + course + ".html";

document.getElementById("testBtn").href =
  "exam.html?course=" + course;

</script>

</body>
</html>
