<!DOCTYPE html>
<html>
<head>
  <title>Examify Chapter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 15px;
    }

    .box {
      background: #f4f6f9;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
    }

    .btn {
      display: inline-block;
      padding: 10px 15px;
      margin-top: 10px;
      background: #0d6efd;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    .muted {
      color: gray;
    }
  </style>
</head>

<body>

<div class="container">

  <h2 id="courseTitle">Loading...</h2>
  <h3 id="chapterTitle"></h3>

  <!-- 📚 LEARN CONTENT -->
  <div class="box" id="learnBox">
    Loading content...
  </div>

  <!-- NAV -->
  <a class="btn" id="backBtn">⬅ Back</a>
  <a class="btn" id="testBtn">📝 Take Course Test</a>

</div>

<script>

// Get saved data
const course = localStorage.getItem("gstCourse");
const chapterId = parseInt(localStorage.getItem("chapterId"));

// Course names
const courses = {
  gst101: "GST 101 - Use of English & Library",
  gst102: "GST 102 - Philosophy & Human Existence",
  gst103: "GST 103 - Culture & Ethics",
  gst111: "GST 111 - Nigerian Peoples & Culture",
  gst112: "GST 112 - History & Philosophy of Science",
  gst113: "GST 113 - Peace Studies & Conflict Resolution",
  gst114: "GST 114 - Communication in French"
};

// Set title
document.getElementById("courseTitle").innerText =
  courses[course] || "Unknown Course";

document.getElementById("chapterTitle").innerText =
  "Chapter " + chapterId;

// Load chapter data dynamically
function getChapterTitle() {
  let list = window[course + "Chapters"];
  if (!list) return "No chapter data found";

  let chapter = list.find(c => c.id === chapterId);
  return chapter ? chapter.title : "Chapter not found";
}

// 📚 SIMPLE LEARN CONTENT SYSTEM (YOU CAN EXPAND LATER)
function getLearnContent() {

  const key = course + "_" + chapterId;

  const content = {

    gst101_1: "Introduction to English Lexis and Structure teaches the basics of vocabulary, word formation, and sentence structure.",
    gst101_2: "Essay writing focuses on paragraph development, punctuation rules, and coherent expression.",
    gst101_3: "Phonetics deals with pronunciation and sound systems of English language.",

    gst102_1: "Philosophy is the study of fundamental questions about existence, knowledge, and reality.",
    gst102_2: "History of Western Philosophy explores ancient to modern philosophical thought.",
    gst102_3: "Ethics deals with moral principles guiding human behaviour.",

    gst103_1: "Delta State environment includes geography, culture, and socio-economic life.",
    gst103_2: "DELSU introduces students to university structure and academic life.",
    
    gst111_1: "Nigeria’s national anthem reflects unity and patriotism.",
    gst112_1: "Science evolved from early human curiosity about nature.",
    gst113_1: "Peace studies focus on conflict resolution and harmony.",
    gst114_1: "French communication starts with alphabets and pronunciation."
  };

  return content[key] || "📌 Learn content will be added soon for this chapter.";
}

// Display content
document.getElementById("learnBox").innerHTML = `
  <div class="title">${getChapterTitle()}</div>
  <p class="muted">Learn Section</p>
  <p>${getLearnContent()}</p>

  <a class="btn" href="exam.html?course=${course}">
    📝 Take Course Test
  </a>
`;

// Back button
document.getElementById("backBtn").href =
  "chapters-" + course + ".html";

// Test button
document.getElementById("testBtn").href =
  "exam.html?course=" + course;

</script>

</body>
</html>
