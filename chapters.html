<script src="content.js"></script>

<script>

const course = localStorage.getItem("gstCourse");
const chapterId = parseInt(localStorage.getItem("chapterId"));

const courses = {
  gst101: "GST 101 - Use of English & Library",
  gst102: "GST 102 - Philosophy & Human Existence",
  gst103: "GST 103 - Culture & Ethics"
};

let importantMode = false;
let bookmarks = JSON.parse(localStorage.getItem("bookmarks") || "[]");

const chapterKey = "chapter" + chapterId;

document.getElementById("courseTitle").innerText =
  courses[course] || "Course";

document.getElementById("chapterTitle").innerText =
  "Chapter " + chapterId;

// Render chapter points
function render(list) {
  const box = document.getElementById("contentBox");

  box.innerHTML = list.map(p => `
    <div class="point">
      ${p}
      <div style="font-size:12px;margin-top:5px;">
        ⭐ <span onclick="bookmark('${p.replace(/'/g,"\\'")}')">
          Bookmark
        </span>
      </div>
    </div>
  `).join("");
}

// Load chapter
function load() {

  if (
    !CONTENT[course] ||
    !CONTENT[course][chapterKey]
  ) {
    document.getElementById("contentBox").innerHTML =
      "<b>Chapter not found.</b>";
    return;
  }

  let data = CONTENT[course][chapterKey];

  if (importantMode) {
    data = data.filter(p => p.length < 120);
  }

  render(data);
}

// Search
document.getElementById("search")
.addEventListener("input", e => {

  const value = e.target.value.toLowerCase();

  let data = CONTENT[course][chapterKey];

  data = data.filter(item =>
    item.toLowerCase().includes(value)
  );

  render(data);
});

// Bookmark
function bookmark(text) {

  if (!bookmarks.includes(text)) {

    bookmarks.push(text);

    localStorage.setItem(
      "bookmarks",
      JSON.stringify(bookmarks)
    );

    alert("Bookmarked!");
  }
}

function showBookmarks() {
  render(bookmarks);
}

// Important Mode
function toggleImportant() {
  importantMode = !importantMode;
  load();
}

load();

document.getElementById("backBtn").href =
  "chapters-" + course + ".html";

document.getElementById("testBtn").href =
  "exam.html?course=" + course;

</script>
