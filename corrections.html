<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FundsIQ - Corrections</title>

<link rel="stylesheet" href="corrections.css">

</head>

<body>

<div class="correction-container">

    <!-- Header -->

    <div class="header">

        <h1>📖 Review Your Answers</h1>

        <p>See your mistakes, learn the correct answers, and improve.</p>

    </div>

    <!-- Progress -->

    <div class="progress-card">

        <span id="questionCounter">

            Question 1 of 20

        </span>

    </div>

    <!-- Question -->

    <div class="question-card">

        <h2 id="questionText">

            Question goes here...

        </h2>

    </div>

    <!-- Options -->

    <div id="optionsContainer">

    </div>

    <!-- Answers -->
    
<div class="answer-summary">

    <div class="your-answer">
        ❌ <strong>Your Answer:</strong>
        <span id="your-answer"></span>
    </div>

    <div class="correct-answer">
        ✅ <strong>Correct Answer:</strong>
        <span id="correct-answer"></span>
    </div>

</div>
    <!-- Explanation -->

    <div class="explanation-card">

        <h3>💡 Explanation</h3>

        <p id="explanationText">

            Explanation will appear here.

        </p>

    </div>

    <!-- Navigation -->

    <div class="nav-buttons">

        <button onclick="previousCorrection()">

            ⬅ Previous

        </button>

        <button onclick="nextCorrection()">

            Next ➡

        </button>

    </div>

    <!-- Finish -->

    <button class="finish-btn"

        onclick="location.href='index.html'">

        🏠 Back Home

    </button>

</div>

<script src="questions.js"></script>

<script src="corrections.js"></script>

</body>
</html>
