<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FundsIQ Corrections</title>

<link rel="stylesheet" href="corrections.css">

</head>

<body>

<div class="container">

    <div class="top-bar">

        <button class="back-btn"
        onclick="location.href='result.html'">

        ←

        </button>

        <h2>Corrections</h2>

        <span id="questionCounter">
            1 / 50
        </span>

    </div>

    <div class="progress">

        <div id="progressFill"></div>

    </div>

    <div class="question-card">

        <h3 id="questionText">

            Question goes here...

        </h3>

    </div>

    <div id="optionsContainer"></div>

    <div class="summary-card">

        <div class="summary-item wrong">

            <h4>❌ Your Answer</h4>

            <p id="your-answer"></p>

        </div>

        <div class="summary-item correct">

            <h4>✅ Correct Answer</h4>

            <p id="correct-answer"></p>

        </div>

    </div>

    <div class="explanation-card">

        <div class="explanation-header"
        onclick="toggleExplanation()">

            <h3>💡 Explanation</h3>

            <span id="arrow">▼</span>

        </div>

        <div id="explanationBody">

            <p id="explanationText"></p>

        </div>

    </div>

</div>

<div class="bottom-nav">

    <button onclick="previousCorrection()">

        ⬅ Previous

    </button>

    <button onclick="nextCorrection()">

        Next ➡

    </button>

</div>

<script src="questions.js"></script>
<script src="corrections.js"></script>

</body>
</html>
