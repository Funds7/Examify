<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Examify CBT - Exam</title>

  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#0d6efd">
</head>

<body>

<!-- ===========================
EXAM SETUP
=========================== -->

<div id="setup-screen" class="container">

    <h1>📝 Final CBT Practice</h1>

    <p>Configure your exam before starting.</p>

    <label><strong>Course</strong></label>

    <select id="course-select" class="input">
        <option 
        <option value="gst107">GST114</option>
    </select>

    <br><br>

    <label><strong>Mode</strong></label>

    <select id="mode-select" class="input">
        <option value="Exam">Exam Mode</option>
        <option value="Practice">Practice Mode</option>
    </select>

    <br><br>

    <label><strong>Questions</strong></label>

    <select id="count-select" class="input">
        <option value="50">50 Questions</option>
        <option value="100">100 Questions</option>
        <option value="200">200 Questions</option>
        <option value="ALL">All Questions</option>
    </select>

    <br><br>

    <label><strong>Time</strong></label>

    <select id="time-select" class="input">
        <option value="10">10 Minutes</option>
        <option value="20">20 Minutes</option>
        <option value="30">30 Minutes</option>
        <option value="60">60 Minutes</option>
    </select>

    <br><br>

    <button class="btn" onclick="startExam()">
        🚀 Start Exam
    </button>

</div>

<!-- ===========================
EXAM SCREEN
=========================== -->

<div id="exam-screen" style="display:none;">

<section class="status-bar">

<div class="status-item">
<span id="progress">Question 0 / 0</span>
</div>

<div class="status-item">
<span id="timer">⏰ 00:00</span>
</div>

<div class="status-item">
<span id="mode">Mode</span>
</div>

</section>

<div class="progress-container">
<div id="progress-fill"></div>
</div>

<main class="container">

<div id="question-palette"></div>

<h3 id="question-number"></h3>

<div id="question-box"></div>

<div id="options"></div>

<div class="nav-buttons">

<button onclick="prevQuestion()" class="btn secondary">
⬅ Previous
</button>

<button onclick="markForReview()" class="btn warning">
⭐ Review
</button>

<button onclick="nextQuestion()" class="btn secondary">
Next ➡
</button>

</div>

<button onclick="finishExam()" class="btn danger submit-btn">
📝 Submit Exam
</button>

<p id="review-status"></p>

</main>

</div>

<script src="questions.js"></script>
<script src="engine.js"></script>

</body>
