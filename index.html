<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Examify CBT</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <h1>Examify</h1>
    <p>Practice CBT. Improve your score. Pass your exams.</p>
  </div>

  <!-- EXAM STATUS BAR -->
  <div class="status-bar">
    <h3 id="progress">Question 0 / 0</h3>
    <h3 id="timer">Time Left: 10:00</h3>
  </div>

  <!-- MAIN EXAM CONTAINER -->
  <div class="container">

    <h2>CBT Practice Exam</h2>

    <!-- QUESTION -->
    <div id="question-box"></div>

    <!-- OPTIONS -->
    <div id="options"></div>

    <!-- NAVIGATION -->
    <div class="nav-buttons">
      <button onclick="prevQuestion()">⬅ Previous</button>
      <button onclick="nextQuestion()">Next ➡</button>
      <button class="submit-btn" onclick="finishExam()">Submit Exam</button>
    </div>

    <!-- SCORE -->
    <h2 id="score"></h2>

  </div>

  <!-- SCRIPTS -->
  <script src="questions.js"></script>
  <script src="app.js"></script>

</body>
</html>
