<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FundsIQ Leaderboard</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="leaderboard.css">

</head>


<body>


<div class="container">


    <h1>🏆 Leaderboard</h1>

    <p class="subtitle">
        Top Students This Week
    </p>



    <!-- PREMIUM TOP 3 PODIUM -->

    <div id="top-three">



        <!-- 2ND PLACE -->

        <div class="podium second">

            <div class="avatar">
                🥈
            </div>


            <div class="position">
                2nd
            </div>


            <h3 id="second-name">
                Loading...
            </h3>


            <div class="score" id="second-score">
                ⭐ 0 Points
            </div>

        </div>




        <!-- 1ST PLACE -->

        <div class="podium first">


            <div class="crown">
                👑
            </div>


            <div class="avatar">
                🥇
            </div>


            <div class="position">
                1st
            </div>


            <h2 id="first-name">
                Loading...
            </h2>


            <div class="score" id="first-score">
                ⭐ 0 Points
            </div>


        </div>




        <!-- 3RD PLACE -->

        <div class="podium third">


            <div class="avatar">
                🥉
            </div>


            <div class="position">
                3rd
            </div>


            <h3 id="third-name">
                Loading...
            </h3>


            <div class="score" id="third-score">
                ⭐ 0 Points
            </div>


        </div>



    </div>





    <!-- LOCK SECTION -->


    <div class="unlock-box">


        <h2>
            🔒 Full Rankings Locked
        </h2>


        <p>
            Unlock your complete position and compete with other students.
        </p>


        <h3>
            Cost: 🪙 500 Coins
        </h3>



        <button onclick="unlockLeaderboard()">

            🪙 Unlock Leaderboard

        </button>


    </div>






    <!-- RANKINGS BELOW TOP 3 -->


    <h2 class="ranking-title">
        🏅 Rankings
    </h2>



    <div id="leaderboard-list">


        Loading leaderboard...


    </div>



</div>




<script type="module" src="coin.js"></script>

<script type="module" src="leaderboard.js"></script>



</body>

</html>
