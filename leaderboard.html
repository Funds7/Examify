<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FundsIQ Leaderboard</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="leaderboard.css">

</head>


<body>


<div class="container">

    <h1>🏆 Leaderboard</h1>

    <p class="subtitle">
        Top Students This Week
    </p>

    <!-- COURSE FILTER -->
    <div class="course-filter">

        <button onclick="loadCourseLeaderboard('gst101')">GST 101</button>

        <button onclick="loadCourseLeaderboard('gst102')">GST 102</button>

        <button onclick="loadCourseLeaderboard('gst103')">GST 103</button>

        <button onclick="loadCourseLeaderboard('gst111')">GST 111</button>

        <button onclick="loadCourseLeaderboard('gst112')">GST 112</button>

        <button onclick="loadCourseLeaderboard('gst113')">GST 113</button>

        <button onclick="loadCourseLeaderboard('gst114')">GST 114</button>

    </div>


    <!-- PREMIUM TOP 3 PODIUM -->

    <div id="top-three">


        <div class="podium second">

            <div class="avatar">
                🥈
            </div>

            <div class="position">
                2nd
            </div>

            <h3 id="second-name">
                Loading...
            </h3>

            <div class="score" id="second-score">
                ⭐ 0 Points
            </div>

        </div>




        <div class="podium first">

            <div class="crown">
                👑
            </div>

            <div class="avatar">
                🥇
            </div>

            <div class="position">
                1st
            </div>

            <h2 id="first-name">
                Loading...
            </h2>

            <div class="score" id="first-score">
                ⭐ 0 Points
            </div>

        </div>




        <div class="podium third">

            <div class="avatar">
                🥉
            </div>

            <div class="position">
                3rd
            </div>

            <h3 id="third-name">
                Loading...
            </h3>

            <div class="score" id="third-score">
                ⭐ 0 Points
            </div>

        </div>


    </div>





    <!-- ACTIVATE LEADERBOARD CARD -->

    <div class="activate-box">


        <h2>
            🏆 Activate Leaderboard
        </h2>


        <p>
            See your full ranking position and compete with other students.
        </p>



        <button onclick="activateLeaderboard()">

            🚀 Activate Leaderboard

        </button>


    </div>






    <!-- RANKINGS -->

    <h2 class="ranking-title">
        🏅 Rankings
    </h2>



    <div id="leaderboard-list">

        Loading leaderboard...

    </div>



</div>





<script type="module" src="coin.js"></script>

<script type="module" src="leaderboard.js"></script>



</body>

</html>
