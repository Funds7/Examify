<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FundsIQ - Learn</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Chapter Header -->
    <div class="chapter-header">
        <h1 id="chapterTitle"></h1>
        <p>📚 Learn • Practice • Pass</p>
    </div>

    <!-- Notes -->
    <div id="contentArea"></div>

    <br>

    <!-- Chapter Test Button -->
    <button class="main-btn" onclick="startTest()">
        📝 Take Chapter Test
    </button>

</div>

<script src="content.js"></script>

<script>

// Supports BOTH old and new storage names
const course =
    localStorage.getItem("course") ||
    localStorage.getItem("gstCourse");

const chapter =
    localStorage.getItem("chapter") ||
    localStorage.getItem("chapterId");

const chapterKey = "chapter" + chapter;

console.log("Course:", course);
console.log("Chapter:", chapter);
console.log("Key:", chapterKey);

if (
    typeof CONTENT !== "undefined" &&
    CONTENT[course] &&
    CONTENT[course][chapterKey]
) {

    const notes = CONTENT[course][chapterKey];

    let html = "";

    notes.forEach((point, index) => {

        html += `

<div class="course-card">

    <div class="point-title">
        Point ${index + 1}
    </div>

    <div class="point-body">
        ${point}
    </div>

    <div class="card-buttons">

        <button class="small-btn">
            🔖 Bookmark
        </button>

        <button class="small-btn">
            📤 Share
        </button>

        <button class="small-btn">
            🚩 Report
        </button>

    </div>

</div>

`;

    });

    document.getElementById("contentArea").innerHTML = html;

    document.getElementById("chapterTitle").innerHTML =
        course.toUpperCase() +
        "<br><span>Chapter " + chapter + "</span>";

} else {

    document.getElementById("chapterTitle").innerHTML =
        "Content Not Found";

    document.getElementById("contentArea").innerHTML = `

<div class="course-card">

<h2>Content Not Found</h2>

<p><b>Course:</b> ${course}</p>

<p><b>Chapter:</b> ${chapter}</p>

<p><b>Key:</b> ${chapterKey}</p>

<p>
This chapter could not be found inside <b>content.js</b>.
</p>

</div>

`;

}

function startTest(){

    window.location.href =
    `exam.html?course=${course}&chapter=${chapter}`;

}

</script>

</body>
</html>
