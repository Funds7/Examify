<script>

const course = localStorage.getItem("course");
const chapter = localStorage.getItem("chapter");

// 🔥 SAFE NORMALIZATION (VERY IMPORTANT)
const chapterNumber = String(chapter || "").replace("chapter", "").trim();
const chapterKey = "chapter" + chapterNumber;

// DEBUG (helps you see errors in console)
console.log("COURSE:", course);
console.log("CHAPTER:", chapter);
console.log("CHAPTER KEY:", chapterKey);

const box = document.getElementById("contentArea");
const title = document.getElementById("chapterTitle");

// 🚨 SAFETY CHECK
if (!course || !chapterNumber) {
  box.innerHTML = "<h3>❌ No chapter selected. Go back and choose a chapter.</h3>";
} 
else if (
  CONTENT &&
  CONTENT[course] &&
  CONTENT[course][chapterKey] &&
  Array.isArray(CONTENT[course][chapterKey]) &&
  CONTENT[course][chapterKey].length > 0
) {

  let notes = CONTENT[course][chapterKey];

  let html = "";

  notes.forEach((point, index) => {

    html += `
      <div class="course-card">

        <h3>Point ${index + 1}</h3>

        <p>${point}</p>

        <div style="display:flex;justify-content:space-between;margin-top:10px;">

          <button>🔖 Bookmark</button>
          <button>📤 Share</button>
          <button>🚩 Report</button>

        </div>

      </div>
      <br>
    `;
  });

  box.innerHTML = html;
  title.innerHTML = `${course.toUpperCase()} - Chapter ${chapterNumber}`;

} 
else {

  console.error("MISSING DATA:", {
    course,
    chapter,
    chapterKey,
    CONTENT_EXISTS: !!CONTENT,
    COURSE_EXISTS: !!CONTENT?.[course],
    CHAPTER_EXISTS: CONTENT?.[course]?.[chapterKey]
  });

  box.innerHTML = "<h3>⚠ Chapter content not found. Check content.js</h3>";
}

function startTest(){
  window.location.href = "chapter-test.html";
}

</script>
