<!DOCTYPE html><html>
<head>
  <title>Examify Learn</title>
  <link rel="stylesheet" href="style.css">
</head><body><div class="container">  <h1 id="chapterTitle">Loading Chapter...</h1>  <div id="contentArea"></div>  <br>  <button onclick="startTest()">
    📝 Take Chapter Test
  </button></div><script src="content.js"></script><script>

// Supports BOTH old and new storage names
const course =
  localStorage.getItem("course") ||
  localStorage.getItem("gstCourse");

const chapter =
  localStorage.getItem("chapter") ||
  localStorage.getItem("chapterId");

const chapterKey = "chapter" + chapter;

console.log("Course:", course);
console.log("Chapter:", chapter);
console.log("Key:", chapterKey);

if (
  typeof CONTENT !== "undefined" &&
  CONTENT[course] &&
  CONTENT[course][chapterKey]
) {

  const notes = CONTENT[course][chapterKey];

  let html = "";

  notes.forEach((point, index) => {

    html += `
      <div class="course-card">

        <h3>Point ${index + 1}</h3>

        <p>${point}</p>

        <div style="
          display:flex;
          justify-content:space-between;
          margin-top:10px;
        ">

          <button>🔖 Bookmark</button>
          <button>📤 Share</button>
          <button>🚩 Report</button>

        </div>

      </div>

      <br>
    `;

  });

  document.getElementById("contentArea").innerHTML = html;

  document.getElementById("chapterTitle").innerHTML =
    course.toUpperCase() + " - Chapter " + chapter;

} else {

  document.getElementById("chapterTitle").innerHTML =
    "Content Not Found";

  document.getElementById("contentArea").innerHTML = `
    <div class="course-card">
      <h3>Debug Information</h3>

      <p><b>Course:</b> ${course}</p>
      <p><b>Chapter:</b> ${chapter}</p>
      <p><b>Chapter Key:</b> ${chapterKey}</p>

      <p>
        Content for this chapter was not found.
        Check content.js.
      </p>
    </div>
  `;
}

function startTest() {
  window.location.href = "chapter-test.html";
}

</script></body>
</html>
