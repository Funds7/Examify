<script>

const course = localStorage.getItem("course");
const chapter = localStorage.getItem("chapter");

// safety fix (VERY IMPORTANT)
const chapterKey = "chapter" + Number(chapter || 1);

console.log("Course:", course);
console.log("Chapter:", chapterKey);

if (
  CONTENT &&
  CONTENT[course] &&
  CONTENT[course][chapterKey] &&
  Array.isArray(CONTENT[course][chapterKey])
) {

  let notes = CONTENT[course][chapterKey];

  let html = "";

  notes.forEach((point, index) => {

    html += `
      <div class="course-card">

        <h3>Point ${index + 1}</h3>

        <p>${point}</p>

        <div style="
          display:flex;
          justify-content:space-between;
          margin-top:10px;
        ">

          <button onclick="bookmarkPoint('${point.replace(/'/g, "\\'")}')">
            🔖 Bookmark
          </button>

          <button onclick="sharePoint('${point.replace(/'/g, "\\'")}')">
            📤 Share
          </button>

          <button onclick="reportPoint('${point.replace(/'/g, "\\'")}')">
            🚩 Report
          </button>

        </div>

      </div>

      <br>
    `;
  });

  document.getElementById("contentArea").innerHTML = html;

  document.getElementById("chapterTitle").innerHTML =
    course.toUpperCase() + " - Chapter " + chapter;

} else {

  console.error("Missing data:", {
    course,
    chapter,
    data: CONTENT?.[course]
  });

  document.getElementById("contentArea").innerHTML =
    "<h3>⚠ Chapter not found. Check content.js or chapter selection.</h3>";
}


// optional functions (prevents button errors)
function bookmarkPoint(text){
  alert("Bookmarked!");
}

function sharePoint(text){
  alert("Share feature coming soon!");
}

function reportPoint(text){
  alert("Reported!");
}

function startTest(){
  window.location.href = "chapter-test.html";
}

</script>
