<form id="loginForm">

    <div class="input-group">
        <input
            id="email"
            type="email"
            placeholder="Email Address"
            required>
    </div>

    <div class="input-group">
        <input
            id="password"
            type="password"
            placeholder="Password"
            required>
    </div>

    <a href="forgot-password.html" class="forgot">
        Forgot Password?
    </a>

    <button
        type="submit"
        class="login-btn">
        Login
    </button>

</form>
